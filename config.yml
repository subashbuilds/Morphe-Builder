# =============================================================================
#  Morphe Multi-App Builder — configuration
# =============================================================================
#  This file is the ONLY thing you should need to edit to add, remove, or
#  reconfigure an app. You do not need to touch any .py files.
#
#  How version selection works:
#    For every enabled app, the builder asks the Morphe CLI itself which app
#    version its patches currently support best (`list-versions`), then tries
#    to download that exact version from APKMirror. If that specific upload
#    is missing/blocked, it automatically falls back to the next best
#    supported version instead of failing the whole run.
#
#  How architecture/DPI builds work:
#    Each output architecture is matched to its own APKMirror variant.
#    Selection order: (1) a row using the requested density -- exact
#    "480dpi" or a range containing it, e.g. "480-640dpi"/"360-480dpi" --
#    beats anydpi/nodpi, which beats an unrelated density; (2) the requested
#    architecture, then universal; (3) the row with the FEWEST splits wins,
#    because fewer splits = smaller download and smaller installed app. So a
#    2-split 480-640dpi upload is chosen over a 10-split exact 480dpi one.
#    Equal split counts then prefer an exact DPI, then the plain APK (or
#    bundle, for module builds), then the narrowest density range.
#
#  Multiple patch sources:
#    An app's `patches:` key may be a LIST of patch sources instead of one
#    mapping. All of them are downloaded and applied together in a single
#    patch run (one -p per source, in order), so one app can be patched with
#    two or more patch repos at once. Later sources can override same-named
#    patches from earlier ones. include_patches/exclude_patches may stay a
#    flat list of names (applied to every source) or become one list per
#    source, e.g. include_patches: [["A"], ["B", "C"]].
# =============================================================================

# -----------------------------------------------------------------------------
# Global defaults — used by any app below that doesn't override a value itself.
# -----------------------------------------------------------------------------
defaults:
  # Which architecture-specific APK(s) to build from the single downloaded
  # bundle. Valid entries:
  #   "arm64-v8a"    -> modern 64-bit ARM devices (most phones since ~2018)
  #   "armeabi-v7a"  -> older 32-bit ARM devices
  #   "x86_64"       -> 64-bit Intel/AMD (emulators, some tablets/Chromebooks)
  #   "x86"          -> 32-bit Intel/AMD (rare, older emulators)
  #   "universal"    -> keep ALL architectures in one APK (largest file size,
  #                     works everywhere, no --striplibs applied)
  # You may list as many of these as you want; one output file is built per
  # entry.
  # With no app-level override, build the universal APK.
  architectures: ["universal"]

  # Optional source DPI. Examples: 480, 480dpi, anydpi, or nodpi.
  # If omitted, anydpi/nodpi is preferred automatically. A request for 480
  # narrows the choice to rows using 480 (exact "480dpi" or a range such as
  # "480-640dpi"), then picks the one with the fewest splits = smallest size.
  dpi: null

  # What kind of output(s) to produce:
  #   "apk"    -> a normal, installable, self-signed APK (works everywhere,
  #               no root needed, but you must sign in via MicroG/GmsCore for
  #               apps that need Google Play Services, e.g. YouTube)
  #   "module" -> [EXPERIMENTAL] a Magisk/KernelSU flashable .zip. Ships a
  #               copy of the stock app and force-installs it via root if
  #               it's missing or a different version, then mounts the
  #               patched APK over it -- so it works even with no prior
  #               install or a different version, not just an exact match.
  #               No MicroG needed. Generated by this repo's own module
  #               builder (Morphe itself does not produce Magisk modules)
  #               -- please test it yourself before relying on it, since it
  #               can't be verified inside a CI sandbox.
  #   "both"   -> build both of the above.
  build_mode: "apk"

  # Where the Morphe CLI (the patcher jar) itself comes from.
  cli:
    repo: "MorpheApp/morphe-desktop"        # any GitHub repo that publishes a
                                             # runnable "<name>-all.jar"
    asset_regex: '^morphe-desktop-.*-all\.jar$'
    # channel: "latest" -> newest STABLE (non-prerelease) GitHub release
    # channel: "dev"    -> newest release INCLUDING pre-releases/dev builds
    channel: "latest"

  # Where the *.mpp / *.rvp patch bundle comes from, by default. Each app
  # below normally overrides `repo` (that's the whole point of this file),
  # but `channel` is shared unless an app overrides it too.
  patches:
    asset_regex: '^patches.*\.(mpp|rvp)$'
    channel: "latest"                       # "latest" or "dev", same meaning
                                             # as cli.channel above

# -----------------------------------------------------------------------------
# Apps to build. Each list entry is fully independent. Copy a block to add a
# new app/patch-source combo (works for any ReVanced/Morphe-compatible
# patches repo from any developer, not just the ones below).
# -----------------------------------------------------------------------------
apps:
  - id: youtube                    # short + unique; used in filenames & release tags
    enabled: true                  # set to false to skip this app entirely
    name: "YouTube"                # human-readable, used in release titles/messages
    package_name: "com.google.android.youtube"

    # APKMirror listing location: https://www.apkmirror.com/apk/<org>/<app>/
    apkmirror:
      org: "google-inc"
      app: "youtube"

    patches:
      repo: "MorpheApp/morphe-patches"       # default Morphe patches (has YouTube)
      # channel: "dev"                       # uncomment to track dev/pre-release patches

    # YouTube ships both, matching Morphe's own default recommendation.
    build_mode: "both"
    architectures: ["arm64-v8a", "universal"]

    # Only read when build_mode is "module" or "both".
    module:
      id: "morphe-youtube"                   # must be unique across modules on-device
      author: "subashbuilds"                 # shown in Magisk/KernelSU as the module author

    # include_patches / exclude_patches: leave empty to use Morphe's own
    # defaults for this app. Names must match `list-patches` output exactly.
    include_patches: []
    exclude_patches: ["Custom branding"]

    # version: "21.04.223"                   # uncomment to pin an exact version
                                              # instead of auto-detecting one

  - id: youtube_music
    enabled: true
    name: "YouTube Music"
    package_name: "com.google.android.apps.youtube.music"
    apkmirror:
      org: "google-inc"
      app: "youtube-music"
    patches:
      repo: "MorpheApp/morphe-patches"
    build_mode: "both"
    architectures: ["arm64-v8a", "universal"]
    module:
      id: "morphe-youtube-music"
      author: "subashbuilds"
    include_patches: []
    exclude_patches: ["Custom branding"]

  - id: instagram
    enabled: true
    name: "Instagram"
    package_name: "com.instagram.android"
    apkmirror:
      org: "instagram"
      app: "instagram-instagram"
      # A few apps (Instagram is one) use a shorter prefix in their release
      # page URLs than in their listing directory slug above, e.g.:
      #   listing:  apkmirror.com/apk/instagram/instagram-instagram/
      #   release:  .../instagram-439-0-0-37-89-release/   (NOT "instagram-instagram-...")
      # Leave this unset for apps where both are the same (e.g. YouTube).
      release_prefix: "instagram"
    patches:
      repo: "SysAdminDoc/HushGram"                   # third-party patches, not MorpheApp's own
      asset_regex: '^patches.*\.mpp$'
      # To patch this app with TWO OR MORE patch sources at once, make
      #   patches:  a list instead of a single mapping, e.g.:
      #   patches:
      #     - repo: "SysAdminDoc/HushGram"
      #       asset_regex: '^patches.*\.mpp$'
      #     - repo: "somebody/instagram-patches"
      #       asset_regex: '^patches.*\.(mpp|rvp)$'
      # All listed sources are downloaded and applied together in ONE patch
      # run (one -p per source, in order), so a single app can be patched
      # with two or more patch repos at once; later sources can override
      # same-named patches from earlier ones.
      # include_patches/exclude_patches may also be one list PER source, e.g.
      #   include_patches: [["Patch from source 1"], ["Patch from source 2"]]
      # (per-source lists are unioned; a flat list applies to every source).
    # Instagram/Hushgram has no root "module" variant, only a normal APK.
    build_mode: "apk"
    architectures: ["arm64-v8a"]
    # 480dpi: only rows using 480dpi are considered (exact "480dpi" or a
    # range such as 480-640dpi / 360-480dpi); among those the variant with
    # the fewest splits (smallest download/install) is chosen.
    dpi: 480
    # include_patches / exclude_patches: leave empty to use the patches' own
    # defaults for this app. Names must match `list-patches` output exactly.
    # With several `patches:` sources, use one list per source instead of a
    # flat list to pick patches from each bundle individually.
    include_patches: []
    exclude_patches: []

  - id: gboard
    enabled: true
    name: "Gboard"
    package_name: "com.google.android.inputmethod.latin"
    apkmirror:
      org: "google-inc"
      app: "gboard"
      release_prefix: "gboard-the-google-keyboard"
    patches:
      repo: "jasonwu1994/Gboard-patches"
    build_mode: "apk"
    architectures: ["arm64-v8a"]
    # Select the smallest current Gboard APK supporting 480dpi. The builder
    # accepts APKMirror ranges such as 120-480dpi and falls back to a
    # neutral-DPI variant if 480 is not published.
    dpi: 480
    include_patches: []
    exclude_patches: []
